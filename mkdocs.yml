# =============================================================================
#  Template de entregas — Redes Neurais Artificiais & Deep Learning
#  Serve a qualquer edição da disciplina: https://insper.github.io/ann-dl/
#
#  ANTES DE PUBLICAR: troque todas as linhas marcadas com "# TROCAR" abaixo.
#  Passo a passo em docs/template/index.md > Publicação no GitHub Pages.
# =============================================================================
site_name: ANN-DL · Entregas
site_author: Luca Cazzolato Machado
site_url: https://lucacm.github.io/ann-dl-2026-2/
repo_url: https://github.com/lucacm/ann-dl-2026-2/
repo_name: lucacm/ann-dl-2026-2

theme:
  name: material
  language: pt-BR
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Mudar para o modo escuro

    # Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      toggle:
        icon: material/toggle-switch
        name: Mudar para a preferência do sistema
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    # navigation.indexes removido de propósito: ele faz o cabeçalho de uma seção do
    # menu (ex. "Exercícios") virar link para a página do primeiro item em vez de só
    # expandir/recolher. Sem ele, o cabeçalho de uma seção nunca navega sozinho, só
    # abre o dropdown para os itens de dentro.
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  # Inclusão de arquivos (--8<--): use para trazer os scripts de code/ para o relatório
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption

plugins:
  - search:
      lang: pt
  # Lightbox nas figuras dos relatórios
  - glightbox
  # A data da última alteração é a evidência do prazo de entrega
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - minify:
      minify_html: true
  # Renderiza notebooks .ipynb colocados diretamente na nav
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
      # Sem isto, os .py de code/ virariam páginas do site
      include: ["*.ipynb"]

# Além dos links, valida as âncoras (#secao) — com --strict, âncora quebrada vira erro.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Os scripts de code/ ficam no repositório e são incluídos nos relatórios via --8<--,
# mas não são páginas da navegação.
#
# As entradas abaixo também tiram do menu o que ainda não foi entregue nesta edição
# (MLP, VAE, Projeto) e as páginas de orientação do template (guia de uso,
# exemplos de nav). Os arquivos continuam no repositório para quando cada entrega for
# feita, e nesse momento, volte a entrada correspondente para a `nav` abaixo.
not_in_nav: |
  /exercises/*/code/*
  /exercises/mlp/**
  /exercises/vae/**
  /projects/**
  /template/**
  /examples/**

extra_javascript:
  # A configuração precisa vir ANTES da biblioteca do MathJax
  - javascripts/mathjax.js
  # jsdelivr em vez de unpkg: mais estável em algumas redes onde unpkg fica bloqueado
  # ou lento, e a fórmula simplesmente não aparece (sem erro visível na página).
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# =============================================================================
#  NAVEGAÇÃO — uma entrega, um item de menu.
#
#  Cada item aceita três formas (veja "Exemplos de uso" para os três em ação):
#    1. Markdown ...: exercises/data/index.md
#    2. Notebook  ...: exercises/data/index.ipynb
#    3. Colab     ...: https://colab.research.google.com/drive/<ID>
# =============================================================================
nav:
  - Home: index.md

  # A lista de entregas muda de edição para edição: acrescente ou remova itens
  # aqui e as pastas correspondentes em docs/.
  #
  # Perceptron, MLP, VAE e Projeto ainda não foram entregues nesta edição: as pastas e
  # os templates em branco continuam em docs/, só não aparecem no menu por enquanto
  # (ver not_in_nav acima). Quando cada um for entregue, acrescente a linha correspondente
  # dentro da seção certa abaixo:

  - Data: exercises/data/index.md
  - Perceptron: exercises/perceptron/index.md
  #     - MLP: exercises/mlp/index.md
  #     - VAE: exercises/vae/index.md
  - Projeto: 
    - projects/index.md
    - 1. EDA: projects/eda/index.md
  #     - 2. Classificação: projects/classification/index.md   # escolha UMA das duas
  #     - 2. Regressão: projects/regression/index.md            # e apague a outra
  #     - 3. Generativo: projects/generative/index.md


  # O link para o enunciado já aparece na Home (bloco "Edição") e em cada página de
  # entrega (admonition "Enunciado"), por isso não duplica aqui no menu.
